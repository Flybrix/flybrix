[platformio]
src_dir = .
default_envs = teensy31

[env:teensy31]
platform = teensy
board = teensy31
framework = arduino
board_build.f_cpu = 96000000
build_flags =
    -Wno-unused-variable
lib_ignore =
    SD
lib_deps =
    fastled/FastLED
    pedvide/Teensy_ADC
    https://github.com/nox771/i2c_t3.git
    https://github.com/greiman/SdFat.git#1.1.4
